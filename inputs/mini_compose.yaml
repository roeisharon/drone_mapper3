# Minimal 1-run composition (1 simulation x 1 mission x 1 drone x 1 lidar).
# Used for quick smoke/sanitizer checks where the full 24-run matrix is unnecessarily slow.
simulation_compositions:
  simulations:
    - simulation_config: "simulation/small_simulation_room.yaml"
      mission_configs:
        - "mission/small_mission_room.yaml"

  drone_configs:
    - "drone/drone_small.yaml"

  lidar_configs:
    - "lidar/lidar_long.yaml"
